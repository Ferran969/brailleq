services:
  v4l2_capture:
    build:
      context: .
    devices:
      - "${CAMERA_HOST_DEVICE:-/dev/v4l/by-id/usb-046d_HD_Pro_Webcam_C920_E24E2F9F-video-index0}:/dev/brailleq-camera"
    environment:
      CAMERA_DEVICE: /dev/brailleq-camera
      CAPTURE_ARCHIVE_DIR: /captures
    volumes:
      - "/home/arduino/brailleq-captures:/captures"
