services:
  paddle_ocr_service:
    build:
      context: .

    environment:
      PADDLE_PDX_CACHE_HOME: /models
      PADDLE_PDX_MODEL_SOURCE: bos
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      DEBUG_OVERLAY_DIR: /captures

    volumes:
      - /home/arduino/paddle-cache:/models
      - /home/arduino/brailleq-captures:/captures

    ports:
      - 5000

  # TEMPORARY GPU MIGRATION PROBE: remove after choosing the inference engine.
  paddle_ocr_opencl_probe:
    build:
      context: .
      dockerfile: Dockerfile.opencl-probe

    environment:
      RUSTICL_ENABLE: freedreno

    devices:
      - /dev/dri:/dev/dri

  # TEMPORARY GPU MIGRATION: benchmarks the PP-OCRv5 detector with MNN.
  paddle_ocr_mnn_detector:
    build:
      context: .
      dockerfile: Dockerfile.mnn-detector

    environment:
      RUSTICL_ENABLE: freedreno
      MNN_BENCHMARK_LOOPS: "10"
      MNN_BENCHMARK_WARMUPS: "3"

    devices:
      - /dev/dri:/dev/dri

    volumes:
      - /home/arduino/brailleq-captures:/captures
