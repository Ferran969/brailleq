services:
  paddle_ocr_service:
    build:
      context: .

    environment:
      PADDLE_PDX_CACHE_HOME: /models
      PADDLE_PDX_MODEL_SOURCE: bos
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      DEBUG_OVERLAY_DIR: /captures

    volumes:
      - /home/arduino/paddle-cache:/models
      - /home/arduino/brailleq-captures:/captures

    ports:
      - 5000
